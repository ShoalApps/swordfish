name: Check updates

# Builds and tests every pull request. Library updates from Dependabot are merged automatically
# when everything passes, and a release is published straight after.
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run unit tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest --stacktrace

      - name: Merge library update and publish
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
          # Merges made with this token don't start other workflows by themselves, so start the release.
          gh workflow run build.yml --ref main
