name: Validate changes

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate TV input and bundle
        run: |
          node --test tv/tests/*.cjs
          npm ci --prefix tv --ignore-scripts
          node tv/build.mjs
          git diff --exit-code -- app/src/main/assets/tv/vacuumtube.js
      - name: Validate translation catalogues
        run: python3 tools/check-locales.py
      - name: Build app and UI tests; run unit tests
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

  android16-foreground:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android 16 foreground regression test
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise foreground worker cancellation on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.shoalapps.swordfish.ForegroundLifecycleTest,io.github.shoalapps.swordfish.OfflinePersistenceTest
      - name: Upload Android 16 test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android16-foreground-report
          path: app/build/reports/androidTests/connected
