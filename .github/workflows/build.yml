name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Save error log to ci-log branch
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not (find|resolve|GET)|^> |error:" build.log | head -60 > errors.txt || true
          head -45 errors.txt | while IFS= read -r line; do echo "::error::$line"; done
          cp build.log ci-build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rqf --cached .
          git add -f ci-build.log errors.txt
          git commit -qm "Build log ${{ github.run_number }}"
          git push -f origin ci-log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Tube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tube
          path: Tube.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tube build ${{ github.run_number }}
          body: Install Tube.apk below.
          files: Tube.apk
          make_latest: true
