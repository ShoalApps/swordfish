name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TINTLOOM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TINTLOOM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and run unit tests
        env:
          TINTLOOM_KEYSTORE_PASSWORD: ${{ secrets.TINTLOOM_KEYSTORE_PASSWORD }}
          TINTLOOM_KEY_ALIAS: ${{ secrets.TINTLOOM_KEY_ALIAS }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Save error log to ci-log branch
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not (find|resolve|GET)|^> |error:" build.log | head -60 > errors.txt || true
          head -45 errors.txt | while IFS= read -r line; do echo "::error::$line"; done
          cp build.log ci-build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rqf --cached .
          git add -f ci-build.log errors.txt
          git commit -qm "Build log ${{ github.run_number }}"
          git push -f origin ci-log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TintloomVideo.apk

      - uses: actions/upload-artifact@v7
        with:
          name: TintloomVideo
          path: TintloomVideo.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tintloom Video build ${{ github.run_number }}
          body: Install TintloomVideo.apk below. Tintloom Video is free software under the GPL-3.0 and is not affiliated with Google or YouTube.
          files: TintloomVideo.apk
          make_latest: true

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: TintloomVideo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build instrumented tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # UI tests first (the ones that need YouTube itself are skipped here), then the screenshot tour.
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notAnnotation=com.aaronateataco.materialtube.NetworkTest
            python3 ci/smoke.py TintloomVideo.apk

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/connected

      - name: Save screenshots to ci-shots branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r shots /tmp/out/ 2>/dev/null || mkdir -p /tmp/out/shots
          cd /tmp/out
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-shots
          git add -A
          if ! git commit -qm "Emulator run ${{ github.run_number }}"; then echo "No screenshots this run"; exit 0; fi
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots
