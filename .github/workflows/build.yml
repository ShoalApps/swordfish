name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Save error log to ci-log branch
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not (find|resolve|GET)|^> |error:" build.log | head -60 > errors.txt || true
          head -45 errors.txt | while IFS= read -r line; do echo "::error::$line"; done
          cp build.log ci-build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rqf --cached .
          git add -f ci-build.log errors.txt
          git commit -qm "Build log ${{ github.run_number }}"
          git push -f origin ci-log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MaterialTube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MaterialTube
          path: MaterialTube.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MaterialTube build ${{ github.run_number }}
          body: Install MaterialTube.apk below.
          files: MaterialTube.apk
          make_latest: true

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MaterialTube

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 ci/smoke.py MaterialTube.apk

      - name: Save screenshots to ci-shots branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r shots /tmp/out/ 2>/dev/null || mkdir -p /tmp/out/shots
          cd /tmp/out
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-shots
          git add -A
          git commit -qm "Emulator run ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots
